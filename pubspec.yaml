name: nunakin_app
description: "NunaKin – Voluntary family awareness app. Status sharing and SOS for trusted circles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- DEPENDENCIAS DE ARQUITECTURA ---
  # Manejo de estado (Usando Riverpod para coincidir con el código de UI existente)
  flutter_riverpod: ^2.5.1
  
  # Inyección de dependencias
  get_it: ^7.7.0
  
  # Comparación de objetos
  equatable: ^2.0.5
  
  # Programación funcional (para Either)
  dartz: ^0.10.1
  
  # Utilidades para streams
  async: ^2.11.0
  
  # --- DEPENDENCIAS EXTERNAS (CAPA DE DATOS) ---
  # Firebase (versiones estables y compatibles)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.2.0 # <--- AÑADIDO
  cloud_functions: ^5.6.2 # <--- AÑADIDO Sem9 Paso 8: logout remoto (revoke_own_sessions)
  
  # Almacenamiento local
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  
  # Conectividad de red
  connectivity_plus: ^6.1.5
  
  # Iconos
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.2
  google_maps_flutter: ^2.10.0
  flutter_google_places_sdk: ^0.4.3  # Búsqueda de POIs/lugares (Places SDK New)
  flutter_foreground_task: ^9.1.0
  permission_handler: ^12.0.1
  google_fonts: ^6.3.1
  intl: ^0.19.0  # Formateo de fechas
  
  # --- FUNCIONALIDAD SILENCIOSA ---
  # Widgets de pantalla de inicio
  home_widget: ^0.6.0
  # Quick Actions (3D Touch / Long press shortcuts)
  # DESHABILITADO: Usando implementación 100% nativa (NativeShortcutManager.kt)
  # quick_actions: ^1.0.0
  # Notificaciones locales
  flutter_local_notifications: ^17.2.2
  # Badge en ícono de aplicación
  app_badge_plus: ^1.1.6
  # Point 16: URL launcher para abrir Google Maps
  url_launcher: ^6.3.0
  # Point 2: Abrir configuración del SO para permisos
  app_settings: ^5.1.1
  # Emoji picker para crear estados personalizados
  emoji_picker_flutter: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- DEPENDENCIAS PARA PRUEBAS DE INTEGRACIÓN Y UI ---
  # Framework base de Flutter para pruebas de integración
  integration_test:
    sdk: flutter
  # Framework de pruebas de UI que extiende integration_test
  patrol: ^3.4.6

  flutter_lints: ^5.0.0
  change_app_package_name: ^1.1.0
  
  # Generador de splash screens nativos
  flutter_native_splash: ^2.4.2
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true

# Configuración del splash screen nativo
# DESACTIVADO: Usando drawable vectorial personalizado en launch_background.xml
# para evitar distorsión en diferentes tamaños de pantalla
# flutter_native_splash:
#   color: "#000000"
#   android: true
#   ios: true
#   web: false
